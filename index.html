<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Nhúng CSS vào trang HTML</h1>

    <!-- Phần 1: Inline CSS -->
    <p style="color: red;">
        Phần 1: Văn bản sử dụng Inline CSS
    </p>

    <!-- Phần 2: Internal CSS -->
    <p class="internal">
        Phần 2: Văn bản sử dụng Internal CSS
    </p>

    <!-- Phần 3: External CSS -->
    <p class="external">
        Phần 3: Văn bản sử dụng External CSS
    </p>

</body>
</html>
